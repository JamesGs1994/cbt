    <nav class="nav-bar bg-transparent w-100 p-3">
      <section class="mx-2">
        <img src="./assets/icons/AEPL_lOGO.svg" alt="" />
      </section>
    </nav>

    <div class="module-container">
      <img
        class="img-fluid"
        src="./assets/icons/blue_gradient_bg.svg"
        alt=""
        style="position: absolute; top: 16%; left: auto; z-index: -9999"
      />

      <div class="module-header mt-4">
        <p>PW110-G - Modules</p>
      </div>
      <hr class="items-head-hr" />

      <div
        class="module-lists p-3"
        style="max-height: 330px; overflow: scroll; scroll-behavior: smooth"
      >
        <div class="items-body-content" data-module="AirStarter">
          <p>Air Starter System</p>
        </div>
        <div class="items-body-content" data-module="Ignition">
          <p>Ignition System</p>
        </div>
      </div>
    </div>

    <script>
      // Attach click event to each menu item
      document.querySelectorAll(".items-body-content").forEach((item) => {
        item.addEventListener("click", () => {
          const moduleName = item.dataset.module;
          if (moduleName) {
            const url = `src/modules/${moduleName}/launch.html`;
            window.open(url, "_self");
          }
        });
      });

      document.querySelectorAll(".items-body-content").forEach((item) => {
        const img = item.querySelector(".items-body-img");

        item.addEventListener("mouseover", () => {
          img.src = "./assets/icons/Active bg.svg";
        });

        item.addEventListener("mouseout", () => {
          img.src = "./assets/icons/inactive bg.svg";
        });
      });
    </script>
